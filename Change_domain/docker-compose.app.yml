services:
  app:
    build: .
    container_name: change_domain
    expose:
      - "8000"
#    ports:
#      - "8000:8000"
    labels:
      - "traefik.enable=true"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.app-http.entrypoints=web"
      - "traefik.http.routers.app-http.rule=Host(`vikunja.ru`)"  # ← БЕЗ подчеркивания
      - "traefik.http.routers.app-http.middlewares=redirect-to-https@file"
      # HTTPS с SSL
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.rule=Host(`vikunja.ru`)"  # ← БЕЗ подчеркивания
      - "traefik.http.routers.app.tls.certresolver=le"
      - "traefik.http.services.app.loadbalancer.server.port=8000"
    networks:
      - proxy-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"




networks:
  proxy-network:
    external: true
    name: traefik_proxy-network
