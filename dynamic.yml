# dynamic.yml
http:
  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true

    vikunja-csp:
      headers:
        # Пока оставляем Report-Only для проверки!
        contentSecurityPolicyReportOnly: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline' 'unsafe-eval';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: blob: https:;
          font-src 'self' data:;
          connect-src 'self' ws: wss:;
          object-src 'none';
          base-uri 'self';
          frame-ancestors 'self';
